<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля</title>
    <link rel="icon" href="/img/icon.png" type="image/png">
    <link rel="stylesheet" href="./styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <a href="home-page-guest.html" class="logo">
            <img src="./img/logo.png" alt="Logo">
        </a>
        <a href="login.html" class="header-profile-text">Войти</a>
    </header>

    <main class="main">
        <section class="authorization-form">
            <h2 class="authorization-form-title">Сброс пароля</h2>
            <form action="reset-password-succes.html" method="GET">
                <div class="input-wrapper">
                    <input type="password" class="form-input" placeholder="Пароль" required>
                </div>
                <div class="input-wrapper">
                    <input type="password" class="form-input" placeholder="Повторите пароль" required>
                </div>
                <button type="submit" class="authorization-form-button">Сбросить пароль</button>
                <a href="reset-password-error.html" class="form-link back-link">На главную страницу</a>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="home-page-guest.html">Главная страница</a>
            <a href="generate-form.html">Генерация табулатуры</a>
            <a href="about.html">О проекте</a>
        </div>
        <span class="footer-copy">Кошелев Алексей, гр. 4321-22, 2026 г.</span>
    </footer>
</body>
</html>
